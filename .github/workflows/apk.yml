# Arma el APK de Serena S.O.S. (app de usuarios) con Capacitor y lo publica como "release" descargable desde el celular.
name: APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'apk/**', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apk } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: mkdir -p www && cp ../index.html www/index.html
      - run: npm ci
      # si falla, las últimas líneas salen como anotación (se leen sin descargar el log)
      - run: npx cap sync android > sync.log 2>&1 || { tail -15 sync.log | sed 's/^/::error::/'; exit 1; }
      - run: cd android && { ./gradlew assembleDebug --no-daemon > ../gradle.log 2>&1 || { grep -iE 'error|failure|what went wrong' -A3 ../gradle.log | head -30 | sed 's/^/::error::/'; exit 1; }; }
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk serena-sos.apk
      - uses: actions/upload-artifact@v4
        with: { name: serena-sos-apk, path: apk/serena-sos.apk }
      - name: Publicar descarga
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG="apk-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" serena-sos.apk --title "Serena S.O.S. APK $TAG" --notes "APK de prueba (sismos simulados). Instálalo en Android permitiendo apps de origen desconocido." --latest
